<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Raumplaner - Korrigiert</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 12px 20px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 1.1rem; color: #00e5ff; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 300px; background: #181818; border-right: 1px solid #333; padding: 15px; overflow-y: auto; font-size: 0.85rem; }
  .sidebar h3 { color: #00e5ff; margin-bottom: 8px; font-size: 0.9rem; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .sidebar p { margin-bottom: 10px; color: #aaa; line-height: 1.3; }
  .canvas-container { flex: 1; position: relative; background: #0a0a0a; display: flex; justify-content: center; align-items: center; padding: 20px; }
  svg { background: #141414; border: 2px solid #00e5ff; box-shadow: 0 0 20px rgba(0,229,255,0.15); border-radius: 4px; }
  .draggable { cursor: move; }
  .draggable:hover rect { stroke: #00e5ff; stroke-width: 2px; }
  .wall { stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .window { stroke: #00e5ff; stroke-width: 8; }
  .door-swing { stroke: #ff9100; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
  .door-panel { stroke: #ff9100; stroke-width: 4; }
  .mirror { stroke: #e040fb; stroke-width: 6; }
</style>
</head>
<body>

<header>
  <h1>2D Raumplaner & Layout-Tester (Korrigierte Geometrie)</h1>
</header>

<div class="main">
  <div class="sidebar">
    <h3>Raum-Details</h3>
    <p><b>Grundfläche:</b> 4,40 m × 2,86 m / 3,10 m × 2,28 m</p>
    <p><b>Wandversatz:</b> Ecke bei Tür eingezeichnet.</p>

    <h3>Legende</h3>
    <p><span style="color:#00e5ff;">■</span> Fenster + Heizung</p>
    <p><span style="color:#ff9100;">■</span> Tür (81 cm) & Schwenkbereich</p>
    <p><span style="color:#e040fb;">■</span> Wandspiegel</p>
  </div>

  <div class="canvas-container">
    <!-- 100px = 1m -->
    <svg id="room" width="520" height="360" viewBox="-30 -30 520 360">
      
      <!-- Wandkontur mit Ecken-Versatz bei der Tür -->
      <!-- Oben: 440px | Rechts: Versatz mit Tür | Unten: 310px | Links: 286px -->
      <polygon points="0,0 440,0 440,140 370,140 370,228 0,228" fill="#1e1e1e" />
      <polyline points="0,0 440,0 440,140 370,140 370,228 0,228 0,0" class="wall" fill="none" />

      <!-- Fensterbrett links (124cm lang, 56.5cm tief) -->
      <rect x="0" y="60" width="56.5" height="124" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="2 2"/>
      <line x1="0" y1="60" x2="0" y2="184" class="window" />

      <!-- Tür an der Versatzwand (81cm breit) -->
      <line x1="370" y1="140" x2="370" y2="221" class="door-panel" />
      <path d="M 370,221 A 81,81 0 0,1 427,164" class="door-swing" />

      <!-- Spiegel an der unteren Wand -->
      <line x1="100" y1="228" x2="200" y2="228" class="mirror" />

      <!-- DRAGBARE MÖBEL -->

      <!-- Schreibtisch -->
      <g class="draggable" id="desk" transform="translate(67, 10)">
        <rect width="125" height="65" fill="#37474f" stroke="#78909c" stroke-width="1" rx="3"/>
        <text x="62" y="35" fill="#fff" font-size="11" text-anchor="middle">Schreibtisch</text>
        <rect x="10" y="-5" width="64" height="6" fill="#29b6f6" rx="1"/>
        <rect x="78" y="-5" width="37" height="6" fill="#29b6f6" rx="1"/>
      </g>

      <!-- Bett -->
      <g class="draggable" id="bed" transform="translate(60, 60)">
        <rect width="200" height="155" fill="#455a64" stroke="#90a4ae" stroke-width="1" rx="4"/>
        <text x="100" y="80" fill="#fff" font-size="13" text-anchor="middle">Bett (200x155)</text>
      </g>

      <!-- Kallax 1 & 2 + Aufsatz -->
      <g class="draggable" id="kallax" transform="translate(250, 10)">
        <rect width="158" height="40" fill="#4e342e" stroke="#8d6e63" stroke-width="1" rx="2"/>
        <text x="79" y="25" fill="#fff" font-size="10" text-anchor="middle">Kallax-Block</text>
      </g>

      <!-- PAX Schrank 100cm (Tiefe 58cm) -->
      <g class="draggable" id="pax100" transform="translate(250, 160)">
        <rect width="100" height="58" fill="#2e7d32" stroke="#66bb6a" stroke-width="1" rx="2"/>
        <text x="50" y="33" fill="#fff" font-size="9" text-anchor="middle">PAX 100 (58t)</text>
      </g>

      <!-- PAX Schrank 50cm (Tiefe 35cm - Schmal) -->
      <g class="draggable" id="pax50" transform="translate(10, 185)">
        <rect width="50" height="35" fill="#1b5e20" stroke="#81c784" stroke-width="1" rx="2"/>
        <text x="25" y="20" fill="#fff" font-size="8" text-anchor="middle">PAX 35t</text>
      </g>

    </svg>
  </div>
</div>

<script>
  const svg = document.getElementById('room');
  let selectedElement = null;
  let offset = { x: 0, y: 0 };

  const draggables = document.querySelectorAll('.draggable');

  draggables.forEach(el => {
    el.addEventListener('mousedown', startDrag);
    el.addEventListener('touchstart', startDrag);
  });

  function startDrag(evt) {
    selectedElement = evt.currentTarget;
    const coord = getMousePosition(evt);
    
    const transforms = selectedElement.transform.baseVal;
    if (transforms.length === 0 || transforms.getItem(0).type !== SVGTransform.SVG_TRANSFORM_TRANSLATE) {
      const translate = svg.createSVGTransform();
      translate.setTranslate(0, 0);
      selectedElement.transform.baseVal.insertItemBefore(translate, 0);
    }
    
    const transform = transforms.getItem(0);
    offset.x = coord.x - transform.matrix.e;
    offset.y = coord.y - transform.matrix.f;

    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchmove', drag);
    window.addEventListener('touchend', endDrag);
  }

  function drag(evt) {
    if (selectedElement) {
      evt.preventDefault();
      const coord = getMousePosition(evt);
      const transform = selectedElement.transform.baseVal.getItem(0);
      transform.setTranslate(coord.x - offset.x, coord.y - offset.y);
    }
  }

  function endDrag() {
    selectedElement = null;
    window.removeEventListener('mousemove', drag);
    window.removeEventListener('mouseup', endDrag);
    window.removeEventListener('touchmove', drag);
    window.removeEventListener('touchend', endDrag);
  }

  function getMousePosition(evt) {
    const CTM = svg.getScreenCTM();
    if (evt.touches) { evt = evt.touches[0]; }
    return {
      x: (evt.clientX - CTM.e) / CTM.a,
      y: (evt.clientY - CTM.f) / CTM.d
    };
  }
</script>
</body>
</html>
